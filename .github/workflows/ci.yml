name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install GNOME tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gjs libglib2.0-bin unzip gettext gir1.2-soup-3.0 gir1.2-secret-1
      - name: Run tests
        run: |
          shopt -s failglob
          node --test tests/*.test.cjs
